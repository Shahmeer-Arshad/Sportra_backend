name: sportra-backend # own compose project: never collides with other local stacks

services:
  # ─────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: sportra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-node_starter}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sportra_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-node_starter}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Adminer — Database Management UI
  # Access at: http://localhost:8080
  # Server: postgres | User: postgres | Pass: postgres
  # ─────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: sportra_adminer
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sportra_net

  # ─────────────────────────────────────────
  # Redis (cache, rate limits, realtime hot lane later)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sportra_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-56379}:6379'
    networks:
      - sportra_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # RabbitMQ (event bus). Management UI: http://localhost:55673 (guest / guest)
  # ─────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sportra_rabbitmq
    restart: unless-stopped
    ports:
      - '${RABBITMQ_PORT:-55672}:5672'
      - '${RABBITMQ_UI_PORT:-55673}:15672'
    networks:
      - sportra_net
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────
  # MailHog (catches emails in dev). UI: http://localhost:58025
  # ─────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sportra_mailhog
    restart: unless-stopped
    ports:
      - '${SMTP_PORT:-51025}:1025'
      - '${MAILHOG_UI_PORT:-58025}:8025'
    networks:
      - sportra_net

  # ─────────────────────────────────────────
  # App (uncomment to run fully containerized)
  # ─────────────────────────────────────────
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: sportra_app
  #   restart: unless-stopped
  #   ports:
  #     - '${PORT:-3000}:3000'
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-node_starter}
  #     ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
  #     REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
  #     ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-15m}
  #     REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
  #     ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
  #     NODE_ENV: production
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - sportra_net

volumes:
  postgres_data:
    driver: local

networks:
  sportra_net:
    driver: bridge
